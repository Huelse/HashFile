<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>授权返回</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 32px 20px; background: #f1f5f9; color: #1e293b; }
    main { max-width: 34rem; margin: 8vh auto; padding: 24px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 1.25rem; }
    p { margin: 0; color: #64748b; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f1f5f9; }
      main { border-color: #374151; background: #1f2937; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">正在返回授权结果…</h1>
    <p id="message">请稍候。</p>
  </main>
  <script type="module">
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const messageType = 'hashfile:auth-callback';

    try {
      const { TrimApp } = await import('./vendor/trim-web-app.js');
      const sdk = new TrimApp();
      await sdk.ready();
      const result = sdk.parseAppAuthCallback(window.location.href);

      // 回调 URL 带有授权状态和所选路径，读取后立即从地址栏与当前历史项移除。
      window.history.replaceState(null, '', window.location.pathname + window.location.hash);

      if (!window.opener || window.opener.closed) {
        title.textContent = '授权结果未返回';
        message.textContent = '请回到 HashFile 原窗口重新选择文件或目录。';
      } else {
        window.opener.postMessage({ type: messageType, result }, window.location.origin);
        title.textContent = '已返回原窗口';
        message.textContent = '授权结果已发送。此窗口可以关闭。';
        window.setTimeout(() => window.close(), 300);
      }
    } catch (error) {
      console.warn('Unable to process the authorization callback:', error);
      window.history.replaceState(null, '', window.location.pathname + window.location.hash);
      title.textContent = '无法读取授权结果';
      message.textContent = '请回到 HashFile 原窗口重试。';
    }
  </script>
</body>
</html>
